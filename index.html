<!DOCTYPE html>
<html>
<head>
    <title>I Love You </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

ctx.fillStyle = "black";
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.font = "bold 8px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillStyle = "#ffb6c1";

let scale = 11;
let i = 0;

function draw() {
    if (scale > 16) return;

    let angle = i * (Math.PI * 2) / 120;

    let x = 16 * Math.pow(Math.sin(angle), 3) * scale;
    let y = (
        13 * Math.cos(angle)
        - 5 * Math.cos(2 * angle)
        - 2 * Math.cos(3 * angle)
        - Math.cos(4 * angle)
    ) * scale;

    ctx.fillText(
        "I love you",
        canvas.width / 2 + x,
        canvas.height / 2 - y
    );

    i++;

    if (i >= 120) {
        i = 0;
        scale++;
    }

    setTimeout(draw, 50);
}
draw();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = "bold 8px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffb6c1";
});
</script>

</body>
</html>
